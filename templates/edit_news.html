<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit News Item</title>
  

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      padding: 40px;
      max-width: 800px;
      margin: auto;
    }

    .card {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      padding: 30px;
      margin-top: 20px;
    }

    h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: 600;
      color: #555;
    }

    input[type="text"],
    input[type="date"],
    input[type="url"],
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
      background-color: #fafafa;
      transition: border-color 0.3s;
    }

    input:focus,
    textarea:focus {
      border-color: #007bff;
      outline: none;
      background-color: #fff;
    }

    textarea {
      resize: vertical;
    }

    button {
      margin-top: 25px;
      width: 100%;
      background-color: #007bff;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #0056b3;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      text-decoration: none;
      color: #007bff;
      font-weight: bold;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <a href="{{ url_for('admin') }}" class="back-link">← Back to Panel</a>


  <div class="card">
    <h2>Edit News Item</h2>
    <form action="{{ url_for('update_news') }}" method="post" enctype="multipart/form-data">
      <input type="hidden" name="company_id" value="{{ company_id }}">
      <input type="hidden" name="news_id" value="{{ news.id }}">

      <label for="title">Title</label>
      <input type="text" id="title" name="title" value="{{ news.title }}" required>

      <label for="date">Date</label>
      
	  <input type="date" name="date" value="{{ formatted_input_date }}" required>


      <label for="content">Content</label>
      <textarea id="content" name="content" rows="6" required>{{ news.content }}</textarea>

      <label for="link">Link</label>
      <input type="url" id="link" name="link" value="{{ news.link }}">

      <label>Current Document</label>
{% if news.doc %}
  <p>
    <a href="{{ url_for('static', filename=news.doc) }}" target="_blank" style="color: green;">📄 View Existing Document</a><br>
    <input type="checkbox" name="remove_doc" value="1"> Remove this document
  </p>
{% else %}
  <p style="color: #888;">No document uploaded.</p>
{% endif %}

<label>Upload New Document (optional)</label>
<input type="file" name="doc_file" accept=".pdf">



      <button type="submit">Save Changes</button>
    </form>
  </div>

</body>
</html>
